services:
  01v96-studio:
    image: gaskb/01v96-studio:latest
    container_name: 01v96-studio
    restart: unless-stopped
    ports:
      - "8096:8096"
    # Privileged mode ensures raw USB device access via libusb on Linux hosts
    privileged: true
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - ./data:/app/data
    environment:
      - PORT=8096
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:' + (process.env.PORT || 8096) + '/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
